name: iOS IPA (non signé)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run ios:init
      - name: Archiver sans signature
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Fabriquer le .ipa
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qr GPS-PMR.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: gps-pmr-ios-ipa
          path: GPS-PMR.ipa
